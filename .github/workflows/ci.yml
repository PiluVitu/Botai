name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencias:
    name: Dependências e salvaguardas (lockfile, dedupe, audit, node --test, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Versão lida de package.json > packageManager (pnpm@11.1.1).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dedupe check
        run: pnpm dedupe --check

      - name: Audit (high ou pior)
        run: pnpm audit --audit-level high

      - name: Salvaguardas e gate (node --test)
        run: node --test scripts/*.test.mjs

      - name: actionlint
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  core:
    name: Core (tsc sem DOM + Jest + build + pacote)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc sem lib dom)
        run: pnpm --filter @pilutech/botai-core run lint

      - name: Test (jest + build + conferência do pacote)
        run: pnpm --filter @pilutech/botai-core run test

  imagem:
    name: Imagem do core (docker build + fumaça)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build e tarball do npm
        run: pnpm --filter @pilutech/botai-core run tarball

      - name: docker build sem rede (a imagem só instala o tarball)
        run: docker build --network=none -t botai:fumaca packages/core

      - name: Fumaça (HEALTHCHECK, dourados, usuário, SIGTERM)
        working-directory: packages/core
        run: bash scripts/fumaca-imagem.sh botai:fumaca

  binario:
    name: Binário Bun linux-x64 (dourados + serve)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @pilutech/botai-core run build

      - name: Compilar linux-x64
        working-directory: packages/core
        run: bash scripts/binarios.sh linux-x64

      - name: Fumaça do binário
        working-directory: packages/core
        run: node scripts/fumaca.mjs --binario dist-bin/botai-linux-x64

  extensao:
    name: Extensão (lint + test + builds de Chrome, Firefox e Opera + web-ext lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `wxt prepare` vem dentro dos scripts, nunca como postinstall: um postinstall quebrado derrubaria o install de todos os jobs.
      - name: Lint (wxt prepare + tsc + eslint)
        run: pnpm --filter @pilutech/botai run lint

      - name: Test (vitest)
        run: pnpm --filter @pilutech/botai run test

      - name: Build (+ gate do @source em .output/chrome-mv3)
        run: pnpm --filter @pilutech/botai run build

      - name: Build do Firefox (+ gate do @source em .output/firefox-mv3)
        run: pnpm --filter @pilutech/botai run build:firefox

      - name: Build do Opera, sem minificar (+ gate do @source em .output/opera-mv3)
        run: pnpm --filter @pilutech/botai run build:opera

      # O addons-linter é o validador da AMO; falha só em erro (os avisos vêm do react-dom e do Font Awesome).
      - name: web-ext lint no build do Firefox
        run: pnpm --filter @pilutech/botai run lint:firefox

  site:
    name: Site (lint + tsc + test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @pilutech/botai-site run lint

      - name: Typecheck
        run: pnpm --filter @pilutech/botai-site run typecheck

      - name: Test (jest + node --test)
        run: pnpm --filter @pilutech/botai-site run test

      - name: Build (+ gate do @source + rotas estáticas)
        run: pnpm --filter @pilutech/botai-site run build

  playwright:
    name: Plugin do Playwright (lint + Jest + E2E nos 3 navegadores + pacote)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc)
        run: pnpm --filter @pilutech/botai-playwright run lint

      - name: Jest (lógica + relatório do projeto filho)
        run: pnpm --filter @pilutech/botai-playwright run test

      - name: Navegadores do Playwright
        run: pnpm --filter @pilutech/botai-playwright exec playwright install --with-deps chromium firefox webkit

      - name: E2E (Chromium, Firefox e WebKit)
        run: pnpm --filter @pilutech/botai-playwright run test:e2e

      - name: Build e conferência do pacote
        run: |
          pnpm --filter @pilutech/botai-playwright run build
          node packages/playwright/scripts/conferir-pacote.mjs

      - name: Rastros do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-plugin
          path: packages/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 7
